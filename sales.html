<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booklet Details | DOM Bookshop</title>

  <!-- Corrected CSS Link -->
  <link rel="stylesheet" href="https://domg6027.github.io/dom6027/style.css">

  <!-- Corrected JS path in HEAD with DEFER -->
  <script src="https://domg6027.github.io/dom6027/include.js" defer></script>

  <style>
    .product-wrapper {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    .product-wrapper img.main-thumb {
      max-width: 250px;
      height: auto;
      margin-bottom: 20px;
      border: 3px solid #b58900;
      border-radius: 6px;
    }
    .price {
      font-size: 1.8em;
      font-weight: bold;
      margin: 15px 0;
      color: #b58900; /* Paleo Gold */
    }
    .buy-btn, .read-btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 28px;
      background-color: #4caf50;
      color: #fff;
      text-decoration: none;
      font-size: 1.1em;
      border-radius: 6px;
      font-weight: bold;
    }
    .read-btn { background-color: #2b6cb0; }
    .buy-btn:hover { background-color: #2e5e2e; }
    .error {
      color: red;
      font-size: 1.2em;
      margin-top: 50px;
    }
    .banner-img { display: block; margin: 15px auto; max-width: 100%; height: auto; }
  </style>

<script defer>
async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('code');
  const container = document.getElementById('product');

  if (!productId) {
    container.innerHTML = `<p class="error">No item specified.</p>`;
    return;
  }

  try {
    // Fetching from catalog.json
    const res = await fetch('https://domg6027.github.io/bookshop/catalog.json');
    const catalog = await res.json();

    // Finding product in the .items array
    const product = catalog.items.find(p => p.id === productId);

    if (!product) {
      container.innerHTML = `<p class="error">Resource not found in the Ancient Paths.</p>`;
      return;
    }

    // Build PayPal.me link with dynamic price and product ID
    const paypalLink = `https://www.paypal.me/swdb2018/${product.price}?note=${encodeURIComponent(product.id)}`;

    // Render product details with PayPal button
    container.innerHTML = `
      <h2>${product.title}</h2>
      <img src="${product.thumb}" alt="${product.title}" class="main-thumb">
      <p style="font-size: 1.2em; max-width: 700px; margin: 0 auto;">${product.description}</p>
      <div class="price">$${product.price.toFixed(2)}</div>
      
      <a href="${product.pdf}" target="_blank" rel="noopener noreferrer" class="read-btn">READ ONLINE / DOWNLOAD</a>
      
      <br><br>
      
      <a href="${paypalLink}" target="_blank" rel="noopener noreferrer" class="buy-btn" 
         style="
           display: inline-block;
           background-color: #0070ba;
           color: #fff;
           font-weight: bold;
           padding: 12px 24px;
           text-decoration: none;
           border-radius: 6px;
           font-size: 1.1em;
           text-align: center;
           margin: 10px 0;
         ">
        Pay $${product.price.toFixed(2)} via PayPal
      </a>
      
      <p style="font-size: 0.9em; max-width: 700px; margin: 5px auto;">
        Payments are processed via PayPal to the ministry’s ambassador managing this resource. 
        Note the company name is <strong>Saphah Central Business Services inc. Derech Olam Ministries</strong> 
        and is managed by <strong>M C Sampson</strong>.
      </p>
    `;
  } catch (err) {
    console.error(err);
    container.innerHTML = `<p class="error">System error: Unable to load the Ancient Paths catalog.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</head>

<body>

  <div id="nav-placeholder"></div>
  <div id="header-placeholder"></div>

  <main>
    <div class="centered">
      <img src="EagleBanner468x60.png" alt="DOM Bookshop" class="banner-img" />
    </div>

    <div class="product-wrapper" id="product">
      Loading Paleo-Messianic resource details…
    </div>
  </main>

  <div id="footer-placeholder"></div>

</body>
</html>
